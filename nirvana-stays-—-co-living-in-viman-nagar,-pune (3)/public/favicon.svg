<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- NIRVANA Brand Terracotta Orange Gradient -->
    <linearGradient id="nirvanaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="50%" stop-color="#C87D65" />
      <stop offset="100%" stop-color="#B56A52" />
    </linearGradient>
    <!-- Warm Golden Light Accent Gradient for Window -->
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E" />
      <stop offset="100%" stop-color="#E9C377" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Badge (#0C1520) matching official Nirvana logo badge -->
  <rect width="100" height="100" rx="22" fill="#0C1520" />
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="rgba(200, 125, 101, 0.28)" stroke-width="1.5" />

  <!-- Chimney on roof -->
  <path d="M66 32 L66 21 L74 21 L74 39" fill="none" stroke="url(#nirvanaOrange)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Architectural House Outline in NIRVANA Terracotta Orange -->
  <path
    d="M50 17 L18 45 L26 45 L26 82 L74 82 L74 45 L82 45 Z"
    fill="rgba(200, 125, 101, 0.10)"
    stroke="url(#nirvanaOrange)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Signature 4-Pane Window Motif in Warm Amber/Gold (#E9C377) -->
  <rect x="40" y="53" width="7.5" height="7.5" rx="1.5" fill="url(#warmAmber)" />
  <rect x="52.5" y="53" width="7.5" height="7.5" rx="1.5" fill="url(#warmAmber)" />
  <rect x="40" y="65.5" width="7.5" height="7.5" rx="1.5" fill="url(#warmAmber)" />
  <rect x="52.5" y="65.5" width="7.5" height="7.5" rx="1.5" fill="url(#warmAmber)" />
</svg>
